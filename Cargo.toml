[workspace]
members = [
    "crates/susie-worker",
    "crates/launcher",
    "crates/local-adjust-core",
    "crates/comic-core",
    "crates/vst3-host-tester",
    "tools/png2mag",
    "tools/mask_lab",
    "tools/local_adjust_lab",
    "tools/comic_lab",
]

# 配布バイナリ (本体 = `mimageviewer-core.exe` + launcher = `mimageviewer.exe`) の
# バージョンは workspace 経由で 1 箇所で管理する。launcher は `%APPDATA%/mimageviewer/
# runtime/<version>/` を抽出先に使うので、本体とランチャーの version が乖離すると
# 旧バージョンの runtime dir に新本体を上書きしてしまう。susie-worker / vst3-host-tester
# / png2mag は独立した内部ヘルパーなので workspace inherit せず個別管理。
[workspace.package]
version = "1.1.0"
edition = "2024"
# let-chain (Rust 1.88 で安定化) を本体・サブクレート共通で使っているため明示。
rust-version = "1.88"

[package]
name = "mimageviewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
manual-e2e = []

# 本体 exe のバイナリ名は `mimageviewer-core` (= 内部実体)。
# 配布する `mimageviewer.exe` は別途 `crates/launcher/` のランチャーが生成する。
# ランチャーは初回起動時に core と FFmpeg DLL を %APPDATA% に展開して core を spawn する
# (詳細は CLAUDE.md「FFmpeg LGPL DLL 管理」節を参照)。
[[bin]]
name = "mimageviewer-core"
path = "src/main.rs"

# Manual TensorRT-pack E2E smoke helper.  It is intentionally runnable via
# `cargo run --features manual-e2e --bin test_trt_install`, while the feature
# gate keeps `cargo test --all-targets` from trying to execute an
# installer-named binary on Windows, where UAC installer detection can require
# elevation.
[[bin]]
name = "test_trt_install"
path = "src/bin/test_trt_install.rs"
test = false
bench = false
required-features = ["manual-e2e"]

[target.'cfg(windows)'.dependencies]
# wgpu-hal 27 系が要求する windows 0.58。`windows_058` 別名でアプリ側にも
# 公開し、wgpu の hal::Api::Device 経由で得る ID3D12Resource を OpenSharedHandle
# 経由で生成するときに使う (本体の windows 0.61 とは ID3D12Resource 型互換性なし)。
windows_058 = { package = "windows", version = "0.58", features = [
    "Win32_Graphics_Direct3D12",
    "Win32_Foundation",
] }
windows = { version = "0.61", features = [
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Imaging",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_UI_HiDpi",
] }
windows-numerics = "0.2"
# 注釈 (comic) のフォントピッカー / オノマトペで Windows インストール済みフォントを
# レジストリ (HKLM/HKCU の …\Fonts) から列挙する (src/font_assets.rs)。ラボ
# (tools/comic_lab) と同じ winreg を使う。
winreg = "0.52"

[dependencies]
eframe = { version = "0.33", features = ["wgpu"] }
egui = "0.33"
egui-wgpu = "0.33"
# 動画 GPU レンダリングで wgpu API + dx12 hal 経由の D3D11→wgpu テクスチャ共有が
# 必要なので、明示的に wgpu / wgpu-hal を依存させる (eframe[wgpu] が間接的に
# 引いている版に揃える)。wgpu-hal 27 は windows 0.58 系の ID3D12Resource を要求
# するため、そちらも `windows_058` 別名で導入する (本体側は windows 0.61)。
wgpu = "27"
wgpu-hal = { version = "27", features = ["dx12"] }
pollster = "0.4"
image = { version = "0.25", features = ["jpeg", "png", "webp", "bmp", "gif"] }
# SIMD (SSE4.1/AVX2) 実装のリサイズ。image crate の imageops::resize はスカラー実装で
# 7K-9K クラスの画像で秒単位かかるため、clamp_dynamic_for_gpu とサムネイル生成で使用。
fast_image_resize = { version = "5", features = ["image"] }
png = "0.18"
ttf-parser = "0.25"
flate2 = "1"
local-adjust-core = { path = "crates/local-adjust-core" }
# テキスト注釈 (吹き出し/テキスト/スタンプ/メッセージウィンドウ) の純ロジック。
# egui 非依存。bake_overlay_with_stamps / scale_scene 等を本体から呼ぶ (統合計画
# docs/comic-integration-plan.md §2)。Inc 0 で配線、実使用は Inc 1 以降。
comic-core = { path = "crates/comic-core" }
# 絵文字スタンプ (Twemoji SVG) を表示時に RGBA へラスタライズする。純 Rust
# (usvg + tiny-skia) なので crt-static と両立。SVG バイトは build.rs が
# vendor/twemoji/svg/*.svg から include_bytes! で exe へ同梱する (Inc 4c、
# docs/comic-integration-plan.md / docs/stamp-feature-design.md)。
resvg = "0.45"
kamadak-exif = "0.6"
rexif = "0.7"
rayon = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webp = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.20"
delharc = "0.6"
turbojpeg = { version = "1", features = ["image"] }
pdfium-render = { version = "0.8", features = ["thread_safe"] }
windows-dpapi = "0.2"
base64 = "0.22"
ort = { version = "2.0.0-rc.12", features = ["directml", "cuda", "tensorrt", "load-dynamic"] }
ndarray = "0.17"
# mXD (mxdownloader) が埋め込む X/Twitter メタデータは XMP RDF パケットとして
# JPEG APP1 / PNG iTXt に入っている。quick-xml で xtw:* 名前空間だけ拾う。
quick-xml = "0.39"
# URL をブラウザで開くため (「元ツイートを開く」等)。cmd /c start を書くより
# 安全でクロスプラットフォーム。
opener = "0.8"
# Ctrl+E エクスポートの保存先フォルダ選択ダイアログ。
rfd = "0.15"
# 全文検索エンジン。Ctrl+G グローバルメタ検索の bigram インデックスに使用予定。
# v1 プロトタイプ計測中 (docs/search-expansion-design.md §15.1.1)。問題なければ本採用。
tantivy = { version = "0.26", default-features = false, features = ["mmap", "lz4-compression"] }
uuid = { version = "1", features = ["v4", "serde"] }
# お気に入りのファイルシステム監視。Windows は ReadDirectoryChangesW ベース。
# crossbeam-channel を有効にして、重い std::mpsc を避ける。
notify = { version = "8", default-features = false, features = ["crossbeam-channel"] }
crossbeam-channel = "0.5"
# Gamepad input is polled on a small background thread and dispatched on the UI thread.
gilrs = "0.11"
# タスクトレイアイコン。Windows では Shell_NotifyIcon を内部で使用し、
# メニュー処理用の隠しウィンドウを自動作成する。メインスレッド以外で
# 動かすため、専用スレッドで `PeekMessageW` ポンプを回す実装にしている
# (`src/tray.rs` 参照)。muda は tray-icon が再エクスポートしている。
tray-icon = "0.20"
# 起動時 / 定期的なバージョン更新確認 (GitHub Releases API)。
# rustls-tls 指定で OpenSSL に依存しない (CRT 静的リンク方針との両立)。
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
semver = "1"
# 動画インライン再生 (フルスクリーンで MP4/MKV/MOV/AVI/WMV/MPG/MPEG を再生)。
# BtbN の FFmpeg LGPL shared build を vendor/ffmpeg/ に置き、FFMPEG_DIR で参照する
# (.cargo/config.toml に env で指定済み)。本体 (`mimageviewer-core.exe`) は通常リンク
# だが、配布時は launcher (`mimageviewer.exe`) が 6 DLL (avcodec / avformat / avutil /
# avfilter / swscale / swresample) を include_bytes! で内包し、起動時に
# `%APPDATA%/mimageviewer/runtime/<version>/` へ展開してから core を spawn する。
# *-sys のビルドに libclang (LLVM/Clang) が必要。詳細は CLAUDE.md の
# 「FFmpeg LGPL DLL 管理」節を参照。
ffmpeg-the-third = { version = "3", default-features = false, features = ["codec", "filter", "format", "software-resampling", "software-scaling"] }
# 動画の音声出力 (Windows では WASAPI Shared モード)。
cpal = "0.16"
# 動画倍速再生用のピッチ維持タイムストレッチ。MIT ライセンス。
signalsmith-stretch = "0.1.3"

[dev-dependencies]
tempfile = "3"
# `examples/bench_pdf_count.rs` (PDFium vs lopdf 比較ベンチマーク) でのみ使用。
# 本体には組み込まれない (= 配布バイナリサイズに影響なし)。MIT.
lopdf = "0.36"
# egui UI の回帰テスト用 (WCAG 検証 + 見た目のスナップショット)。
# egui 0.33 系統に合わせて 0.33.x を指定。
egui_kittest = { version = "0.33", features = ["snapshot", "wgpu"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
# 差分ビルド (本体 1 ファイル変更後の rebuild) を高速化する。
# 初回 / clean ビルドは変わらないが、2 回目以降は LLVM codegen の差分実行が効いて
# 大幅短縮 (実測: 本体 79s → 41s、rust-lld 切替との合計効果)。
# target/release/incremental/ に追加キャッシュを作るので target/ サイズが数 GB 増える。
# 配布バイナリの実行時性能差はほぼ無し (Cargo book でも release-incremental は許容範囲とされる)。
incremental = true

# クラッシュ解析専用: release ビルドだが Rust シンボル + line table を残す版。
# 本番 release は触らず、WER ダンプから Rust 関数名 / ソース行を取りたいときだけ使う。
#   cargo build --profile release-debuginfo --bin mimageviewer-core
#   cargo build --profile release-debuginfo --bin mimageviewer
# 成果物は target/release-debuginfo/ に出る。配布には使わない (= サイズ膨らむ + dead-code が残る)。
[profile.release-debuginfo]
inherits = "release"
strip = false
debug = "line-tables-only"
split-debuginfo = "packed"
