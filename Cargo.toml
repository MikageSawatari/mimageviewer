[workspace]
members = [
    "crates/susie-worker",
    "crates/susie-crash-plugin",
    "crates/launcher",
    "crates/local-adjust-core",
    "crates/comic-core",
    "crates/music-core",
    "crates/remote-ipc",
    "crates/remote-web",
    "crates/vst3-host-tester",
    "tools/png2mag",
    "tools/mask_lab",
    "tools/local_adjust_lab",
    "tools/comic_lab",
    "tools/music_lab",
    "tools/seek_strip_probe",
    "tools/viewer_context_audit",
]
exclude = ["crates/unrar-patched", "vendor/eframe", "vendor/egui-wgpu"]

[patch.crates-io]
eframe = { path = "vendor/eframe" }
egui-wgpu = { path = "vendor/egui-wgpu" }

# 配布バイナリ (本体 = `mimageviewer-core.exe` + remote service +
# launcher = `mimageviewer.exe`) の
# バージョンは workspace 経由で 1 箇所で管理する。launcher は `%APPDATA%/mimageviewer/
# runtime/<version>/` を抽出先に使うので、core / remote / launcher の version が乖離すると
# 旧バージョンの runtime dir に新しい実行ファイルを上書きしてしまう。susie-worker / vst3-host-tester
# / png2mag は独立した内部ヘルパーなので workspace inherit せず個別管理。
[workspace.package]
version = "3.3.0"
edition = "2024"
# let-chain (Rust 1.88 で安定化) を本体・サブクレート共通で使っているため明示。
rust-version = "1.88"

[package]
name = "mimageviewer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
autobins = false

[features]
manual-e2e = []
# Opt-in in-process Rhai runner for isolated application tests. Production
# builds keep this disabled unless the developer explicitly requests it.
test-script = []
# ベンチマーク、配布パック生成、診断用の補助 bin は通常の build/test 対象から外す。
# 必要なときだけ `--features dev-tools --bin <name>` で明示的に有効化する。
dev-tools = ["pack-build-tools"]
# pack builder 2 本だけを全体テスト時に有効化する内部 feature。dev-tools 全体を
# 有効にせず、この 2 本の unit test を本体 lib と同じ feature graph で実行する。
pack-build-tools = []

# loose-deps ポータブルビルド。native 依存 (pdfium / onnxruntime / susie ワーカー /
# vst3-host / AI モデル) を `include_bytes!` で埋め込まず、exe と同じディレクトリの
# loose ファイルから解決する。data_dir も既定で `<exe_dir>/data` を指す (APPDATA を
# 触らない)。配布は launcher を使わず core を `mimageviewer.exe` にリネームして同梱
# DLL/モデルと一緒に zip 配布する。詳細: docs/portable-build-plan.md
portable = []

# 本体 exe のバイナリ名は `mimageviewer-core` (= 内部実体)。
# 配布する `mimageviewer.exe` は別途 `crates/launcher/` のランチャーが生成する。
# ランチャーは初回起動時に core、remote service と FFmpeg DLL を %APPDATA% に展開して core を spawn する
# (詳細は CLAUDE.md「FFmpeg LGPL DLL 管理」節を参照)。
[[bin]]
name = "mimageviewer-core"
path = "src/main.rs"
bench = false

# Development-only helpers.  Keeping these behind one feature prevents normal
# application builds and integration tests from compiling every helper binary.
[[bin]]
name = "bench_ai"
path = "src/bin/bench_ai.rs"
test = false
bench = false
required-features = ["dev-tools"]

[[bin]]
name = "bench_scroll"
path = "src/bin/bench_scroll.rs"
