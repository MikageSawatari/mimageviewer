[package]
name = "comic-core"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[lib]
name = "comic_core"
path = "src/lib.rs"

[dependencies]
# "rc" は StampSource::Embedded の base64 PNG を Arc<str> で持つために必要。これで undo
# スナップショット (objects.to_vec()) や comic_docs の clone が画像データを複製せず Arc
# ポインタ複製だけで済む (大きい埋め込みスタンプでのメモリ/CPU 跳ねを防ぐ)。
serde = { version = "1", features = ["derive", "rc"] }
# Vertical text via OpenType features (docs/vertical-text-opentype-plan.md, 案B):
# - rustybuzz: pure-Rust HarfBuzz port = the single font parser + shaper. Vertical
#   runs are shaped with Direction::TopToBottom, so the font's `vert` feature (or
#   the UAX#50 fallback) is applied automatically — correct vertical glyph forms
#   (。、…ー brackets) + vertical metrics, no per-character workarounds. Its
#   re-exported `ttf_parser` also provides glyph outlines.
# - ab_glyph_rasterizer: the coverage engine `ab_glyph` uses internally. We feed
#   it the ttf_parser outlines, so there is ONE font parser and AA quality matches
#   the previous ab_glyph path. 袋文字 dilation / rotate_cw operate on the coverage.
rustybuzz = "0.20.1"
ab_glyph_rasterizer = "0.1.10"
# Owns the font bytes + a borrowing rustybuzz::Face parsed ONCE (self-referential).
# Rebuilding Face::from_slice per metric/shape/raster call was a severe perf bug
# (~46us each on a .ttc); caching the parsed face makes those calls ~free.
self_cell = "1"
