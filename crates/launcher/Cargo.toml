[package]
name = "mimageviewer-launcher"
# workspace ルート (`Cargo.toml` の `[workspace.package]`) と version を同期する。
# launcher は `%APPDATA%/mimageviewer/runtime/<version>/` を抽出先に使うため、
# 本体と launcher の version が乖離すると旧 runtime dir に新本体を上書きする事故になる。
version.workspace = true
edition.workspace = true
publish = false
rust-version.workspace = true

# 配布する `mimageviewer.exe` を生成する小さなランチャークレート。
#
# 役割:
#   - core / remote / EPUB worker、FFmpeg DLL、VC runtime と EffeTune bundle 全体を
#     `include_bytes!` で内包する (本クレートの src/main.rs 参照)
#   - 初回起動時に `%APPDATA%\mimageviewer\runtime\<version>\` へ展開
#   - core を spawn → 使用中lease引き渡しの通知後にランチャー終了
#
# FFmpeg API は呼ばないので Windows ローダの DLL 解決問題を完全に回避する。
# 本体クレート (`mimageviewer-core.exe`) は ffmpeg-the-third を import library
# 経由で使うが、それは展開後の同じディレクトリに 6 DLL があれば確実に解決される。
#
# ビルド前提: `target/release` の core / remote / EPUB worker を先にビルドする。
# `scripts/build-release.{sh,ps1}` が core -> remote -> EPUB worker -> launcher の順でビルドする。
# EffeTune は vendor/effetune-mixwright または MIMV_EFFETUNE_DIR の完全なbundleを参照する。

[[bin]]
name = "mimageviewer"
path = "src/main.rs"

[dependencies]
miv-startup = { path = "../startup-diagnostics" }
sha2 = "0.10"
fs4 = "0.13"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
sha2 = "0.10"
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
