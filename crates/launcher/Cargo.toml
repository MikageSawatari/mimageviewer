[package]
name = "mimageviewer-launcher"
version = "0.8.2"
edition = "2024"
publish = false
rust-version = "1.88"

# 配布する `mimageviewer.exe` を生成する小さなランチャークレート。
#
# 役割:
#   - 本体 `mimageviewer-core.exe` と FFmpeg LGPL shared DLL 5 ファイルを
#     `include_bytes!` で内包する (本クレートの src/main.rs 参照)
#   - 初回起動時に `%APPDATA%\mimageviewer\runtime\<version>\` へ展開
#   - core を `std::process::Command::spawn` で起動 → ランチャー即終了
#
# FFmpeg API は呼ばないので Windows ローダの DLL 解決問題を完全に回避する。
# 本体クレート (`mimageviewer-core.exe`) は ffmpeg-the-third を import library
# 経由で使うが、それは展開後の同じディレクトリに 5 DLL があれば確実に解決される。
#
# ビルド前提: 本パッケージは `target/release/mimageviewer-core.exe` を
# `include_bytes!` で参照するため、core を先にビルドしておく必要がある。
# `scripts/build-release.{sh,ps1}` が 2 段階ビルドを行う。

[[bin]]
name = "mimageviewer"
path = "src/main.rs"

[dependencies]
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
