[package]
name = "epub-pdf-worker"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mimageviewer-epub-pdf"
path = "src/main.rs"

[[bin]]
name = "epub-pdf-job-probe"
path = "src/job_probe.rs"

[dependencies]
quick-xml = "0.41"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
lopdf = "0.36"
percent-encoding = "2"
walkdir = "2"
base64 = "0.22"
sha2 = "0.10"
webview2-com = "0.39"
windows = { version = "0.62", features = ["Wdk_System_Threading", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_Com", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
