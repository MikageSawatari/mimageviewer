[lib]
name = "local_adjust_core"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
flate2 = "1"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
