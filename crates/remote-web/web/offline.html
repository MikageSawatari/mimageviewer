<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#111318">
    <meta name="referrer" content="no-referrer">
    <title>mIV に接続できません</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111318;
        color: #f2f3f5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: max(32px, env(safe-area-inset-top))
          max(24px, env(safe-area-inset-right))
          max(32px, env(safe-area-inset-bottom))
          max(24px, env(safe-area-inset-left));
        display: grid;
        place-items: center;
        background: #111318;
      }

      main {
        width: min(100%, 32rem);
        text-align: center;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(1.5rem, 7vw, 2rem);
        line-height: 1.3;
      }

      p {
        margin: 0;
        color: #c7cbd2;
        font-size: 1rem;
        line-height: 1.75;
      }

      a {
        display: inline-flex;
        min-height: 48px;
        margin-top: 28px;
        padding: 0 24px;
        align-items: center;
        justify-content: center;
        border: 1px solid #777f8d;
        border-radius: 999px;
        color: #f2f3f5;
        font-weight: 650;
        text-decoration: none;
        background: #252932;
      }

      a:active {
        background: #303641;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>mIV に接続できません</h1>
      <p>
        PC で mIV が起動していることと、リモート接続が有効になっていることを確認してください。
      </p>
      <a href="/">もう一度試す</a>
    </main>
  </body>
</html>
