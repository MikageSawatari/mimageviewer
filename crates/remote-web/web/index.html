<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#111318">
    <meta name="referrer" content="no-referrer">
    <meta name="miv-remote-asset-token" content="__MIV_REMOTE_ASSET_TOKEN__">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="mIV Remote">
    <title>mIV Remote</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <div
      id="remote-session-owner-badge"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <button id="telemetry-hud" type="button" aria-label="計測 HUD を隠す"></button>
    <script type="module" src="/app.js"></script>
  </body>
</html>
