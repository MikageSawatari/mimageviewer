<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <!-- ホーム画面へ追加した standalone では iOS がこの倍率制限を尊重する。通常タブでは
         無視されるが、そこでも害は無い。JS で 2 打目の touchend を preventDefault しても
         拡大は止まらないことを実測で確認している (suppressed の 46ms 後に scale 1 → 1.03)。
         画像のピンチ拡大はアプリが自前で持っているので、失うのは UI 全体の拡大だけ。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#111318">
    <meta name="referrer" content="no-referrer">
    <meta name="miv-remote-asset-token" content="__MIV_REMOTE_ASSET_TOKEN__">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="mIV Remote">
    <title>mIV Remote</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <div
      id="remote-session-owner-badge"
      role="status"
      aria-live="polite"
      hidden
    ></div>
    <button id="telemetry-hud" type="button" aria-label="計測 HUD を隠す"></button>
    <!--
      アプリ本体は module なので、必要なファイルが 1 つでも読めないと何も実行されず、
      画面が黒いまま止まる。読めないこと自体は正しい結果だが、黒いだけでは何が起きたか
      分からない。この受け皿は module ではなく、本体が動かなくても必ず動く。
    -->
    <script>
      (function () {
        var failedUrls = [];
        addEventListener(
          "error",
          function (event) {
            var target = event && event.target;
            var url = target && (target.src || target.href);
            if (url && failedUrls.indexOf(String(url)) < 0) {
              failedUrls.push(String(url));
            }
          },
          true
        );
        setTimeout(function () {
          if (window.__mivRemoteAppStarted) return;
          var app = document.querySelector("#app");
          if (!app || app.childElementCount > 0) return;
          app.setAttribute("style", [
            "display:grid",
            "place-items:center",
            "height:100%",
            "padding:24px",
            "text-align:center",
            "line-height:1.7",
          ].join(";"));
          var card = document.createElement("div");
          var title = document.createElement("p");
          title.textContent = "アプリを読み込めませんでした。";
          title.setAttribute("style", "margin:0 0 12px;font-size:1.15rem;font-weight:700");
          card.appendChild(title);
          var hint = document.createElement("p");
          hint.textContent =
            "再読み込みしてください。それでも表示されない場合は、PC 側の mImageViewer を再起動してください。";
          hint.setAttribute("style", "margin:0 0 18px;color:#aab1bf");
          card.appendChild(hint);
          if (failedUrls.length) {
            var detail = document.createElement("p");
            detail.textContent = "読み込めなかったファイル: " + failedUrls.join(", ");
            detail.setAttribute(
              "style",
              "margin:0 0 18px;color:#aab1bf;font-size:0.82rem;word-break:break-all"
            );
            card.appendChild(detail);
          }
          var reload = document.createElement("button");
          reload.type = "button";
          reload.textContent = "再読み込み";
          reload.setAttribute("style", [
            "min-height:48px",
            "padding:0 24px",
            "border:0",
            "border-radius:14px",
            "background:#42a5f5",
            "color:#07121d",
            "font:inherit",
            "font-weight:700",
            "touch-action:manipulation",
          ].join(";"));
          reload.addEventListener("click", function () {
            location.reload();
          });
          card.appendChild(reload);
          app.appendChild(card);
        }, 8000);
      })();
    </script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
