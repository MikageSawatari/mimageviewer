# Unit/integration iteration and scripts/test-full.ps1 (workspace + vendor libs).
# The full gate runs workspace doctests separately with cargo test --doc.
nextest-version = "0.9.143"

[profile.default]
test-threads = "num-cpus"
retries = 0
fail-fast = false
# Six recent full runs: non-overridden tests peaked near 60s; allow 5x that.
# The five measured long tests peaked at 260s; allow 600s without retries.
slow-timeout = { period = "60s", terminate-after = 5 }
status-level = "slow"
final-status-level = "slow"

[profile.default.junit]
path = "junit.xml"
report-skipped = "all"

# Start measured long-running tests early, without skipping or retrying them.
[[profile.default.overrides]]
filter = "test(=ui_fullscreen::tests::still_seek_f4_screen_last_pixel_closes_strip_with_real_geometry) | test(=app::folder_scan::section1375_scan_perf_tests::section1375_large_physical_scan_10k_100k) | test(=raw::tests::all_cc0_samples_info_develop_and_preview_orientation) | test(=video::tests::real_decoder_eof_full_loop_preserves_single_tail_burst_per_epoch) | test(=ui_music_timeline::tests::key_synthetic_harmonic_major_minor_progressions_and_percussion_comparison)"
priority = 100
slow-timeout = { period = "120s", terminate-after = 5 }
